<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestionnaire de Tâches</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📋 Gestionnaire de Tâches</h1>
            <button id="btnNouvelletache" class="btn btn-primary">➕ Nouvelle Tâche</button>
        </header>

        <!-- Section Filtres -->
        <section class="filters">
            <h2>🔍 Filtres et Recherche</h2>
            <div class="filter-grid">
                <input type="text" id="searchQuery" placeholder="Rechercher...">
                
                <select id="filterStatut">
                    <option value="">Tous les statuts</option>
                    <option value="à faire">À faire</option>
                    <option value="en cours">En cours</option>
                    <option value="terminée">Terminée</option>
                    <option value="annulée">Annulée</option>
                </select>
                
                <select id="filterPriorite">
                    <option value="">Toutes priorités</option>
                    <option value="basse">Basse</option>
                    <option value="moyenne">Moyenne</option>
                    <option value="haute">Haute</option>
                    <option value="critique">Critique</option>
                </select>
                
                <select id="filterCategorie">
                    <option value="">Toutes catégories</option>
                    <option value="perso">Personnel</option>
                    <option value="travail">Travail</option>
                    <option value="projet">Projet</option>
                    <option value="autre">Autre</option>
                </select>
                
                <select id="sortBy">
                    <option value="dateCreation">Date de création</option>
                    <option value="echeance">Date d'échéance</option>
                    <option value="priorite">Priorité</option>
                </select>
                
                <select id="sortOrder">
                    <option value="asc">Croissant</option>
                    <option value="desc">Décroissant</option>
                </select>
                
                <button id="btnAppliquerFiltres" class="btn btn-secondary">Appliquer</button>
                <button id="btnResetFiltres" class="btn btn-outline">Réinitialiser</button>
            </div>
        </section>

        <!-- Liste des tâches -->
        <section class="tasks-list">
            <h2>📝 Mes Tâches <span id="taskCount">(0)</span></h2>
            <div id="tasksContainer"></div>
        </section>
    </div>

    <!-- Modal Formulaire Tâche -->
    <div id="taskModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 id="modalTitle">Nouvelle Tâche</h2>
            <form id="taskForm">
                <input type="hidden" id="taskId">
                
                <div class="form-group">
                    <label for="titre">Titre *</label>
                    <input type="text" id="titre" required>
                </div>
                
                <div class="form-group">
                    <label for="description">Description *</label>
                    <textarea id="description" rows="4" required></textarea>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="echeance">Échéance *</label>
                        <input type="date" id="echeance" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="statut">Statut</label>
                        <select id="statut">
                            <option value="à faire">À faire</option>
                            <option value="en cours">En cours</option>
                            <option value="terminée">Terminée</option>
                            <option value="annulée">Annulée</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="priorite">Priorité</label>
                        <select id="priorite">
                            <option value="basse">Basse</option>
                            <option value="moyenne">Moyenne</option>
                            <option value="haute">Haute</option>
                            <option value="critique">Critique</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="categorie">Catégorie</label>
                        <select id="categorie">
                            <option value="perso">Personnel</option>
                            <option value="travail">Travail</option>
                            <option value="projet">Projet</option>
                            <option value="autre">Autre</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="etiquettes">Étiquettes (séparées par des virgules)</label>
                    <input type="text" id="etiquettes" placeholder="urgent, important, ...">
                </div>
                
                <h3>Auteur</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label for="auteurNom">Nom *</label>
                        <input type="text" id="auteurNom" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="auteurPrenom">Prénom *</label>
                        <input type="text" id="auteurPrenom" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="auteurEmail">Email *</label>
                    <input type="email" id="auteurEmail" required>
                </div>
                
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Enregistrer</button>
                    <button type="button" class="btn btn-outline" id="btnAnnuler">Annuler</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Détails Tâche -->
    <div id="detailsModal" class="modal">
        <div class="modal-content modal-large">
            <span class="close" id="closeDetails">&times;</span>
            <div id="taskDetails"></div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
